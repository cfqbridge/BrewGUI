name: Build & Release BrewGUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.6.261106)'
        required: false
        default: '1.6.261106'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Version Environment
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version || '1.6.261106' }}"
            VERSION="${VERSION#v}"
            TAG_NAME="v${VERSION}"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "Packaging BrewGUI v$VERSION (tag: $TAG_NAME)"

      - name: Build and Package App Bundle & DMG
        run: |
          chmod +x scripts/bundle_app.sh
          ./scripts/bundle_app.sh

      - name: Generate Checksums & version.json for Auto-Update
        run: |
          cd dist
          SHA256=$(shasum -a 256 BrewGUI.dmg | awk '{print $1}')
          echo "SHA256: $SHA256"
          echo "BREWGUI_SHA256=$SHA256" >> $GITHUB_ENV
          
          cat > version.json <<EOF
          {
            "version": "${{ env.APP_VERSION }}",
            "release_date": "$(date +%Y-%m-%d)",
            "download_url": "https://github.com/cfqbridge/BrewGUI/releases/latest/download/BrewGUI.dmg",
            "sha256": "$SHA256",
            "release_page": "https://github.com/cfqbridge/BrewGUI/releases"
          }
          EOF
          cat version.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BrewGUI v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/BrewGUI.dmg
            dist/version.json
